{% extends "interviews/base.html" %}
{% block title %}Update Interview — TalentSphere Elevate{% endblock %}
{% block interview_content %}
<div class="section">
  <div class="section-title">Update Interview — {{ interview.candidate.username }} / {{ interview.job.title }}</div>
  <div class="item-card">
    <form method="post" style="display:grid; gap:12px; max-width:760px;">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn-small btn-brass" type="submit">Save & Notify</button>
    </form>
  </div>
</div>
{% endblock %}
